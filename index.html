<script>
(function(){
  var toggleBtn = document.getElementById('zexToggleBtn');
  var closeBtn = document.getElementById('zexCloseBtn');
  var overlay = document.getElementById('zexOverlay');
  var frame = document.getElementById('zexFrame');
  var loaded = false;
  function openZex(){
    if(!loaded){
      var b64 = document.getElementById('zexWidgetB64').textContent.trim();
      var binary = atob(b64);
      var bytes = new Uint8Array(binary.length);
      for (var i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
      var html = new TextDecoder('utf-8').decode(bytes);
      frame.srcdoc = html;
      loaded = true;
    }
    overlay.style.display = 'block';
  }
  function closeZex(){ overlay.style.display = 'none'; }
  toggleBtn.addEventListener('click', openZex);
  closeBtn.addEventListener('click', closeZex);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && overlay.style.display === 'block') closeZex();
  });
})();
</script>
